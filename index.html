
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM50 Reward Demo</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101827, #174d42);
    color: white;
  }

  .card {
    width: 100%;
    max-width: 390px;
    padding: 28px;
    text-align: center;
    background: #ffffff12;
    border: 1px solid #ffffff30;
    border-radius: 24px;
    box-shadow: 0 15px 50px #0005;
  }

  .gift { font-size: 55px; }

  h1 { color: #ffe082; }

  .amount {
    font-size: 48px;
    font-weight: bold;
    color: #ffe082;
    margin: 20px 0;
  }

  .note {
    font-size: 13px;
    color: #d1d5db;
    line-height: 1.6;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .gold { background: #ffe082; color: #18251e; }
  .green { background: #42d392; color: #10261c; }

  #status {
    margin-top: 18px;
    overflow-wrap: anywhere;
    line-height: 1.6;
  }

  a { color: #ffe082; }
</style>
</head>

<body>
<div class="card">
  <div class="gift">🎁</div>
  <h1>GANJARAN ISTIMEWA</h1>

  <div class="amount">RM50.00</div>

  <p>Selamat datang ke demo ganjaran!</p>

  <p class="note">
    Ini hanyalah demo. Tiada wang sebenar diberikan.
    Perkongsian lokasi adalah pilihan dan memerlukan
    kebenaran anda.
  </p>

  <button class="gold" onclick="claim()">
    🎉 Cuba Tuntutan Demo
  </button>

  <button class="green" onclick="getLocation()">
    📍 Kongsi Lokasi Saya
  </button>

  <div id="status" aria-live="polite"></div>
</div>

<script>
function claim() {
  document.getElementById("status").textContent =
    "🎉 Berjaya! Ini cuma simulasi tuntutan RM50.";
}

function getLocation() {
  const status = document.getElementById("status");
  status.textContent = "Meminta kebenaran lokasi...";

  if (!navigator.geolocation) {
    status.textContent =
      "Browser anda tidak menyokong fungsi lokasi.";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      const mapURL =
        "https://www.google.com/maps?q=" + lat + "," + lon;

      status.replaceChildren();

      const message = document.createElement("p");
      message.textContent =
        "Lokasi berjaya diperoleh pada peranti ini.";

      const coordinates = document.createElement("p");
      coordinates.textContent =
        "Latitude: " + lat.toFixed(6) +
        " | Longitude: " + lon.toFixed(6);

      const link = document.createElement("a");
      link.href = mapURL;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Lihat lokasi di Google Maps";

      const share = document.createElement("button");
      share.className = "green";
      share.textContent = "Salin pautan lokasi";

      share.onclick = async function() {
        try {
          await navigator.clipboard.writeText(mapURL);
          share.textContent = "Pautan disalin!";
        } catch {
          window.prompt("Salin pautan ini:", mapURL);
        }
      };

      status.append(message, coordinates, link, share);
    },
    function(error) {
      status.textContent =
        error.code === 1
          ? "Kebenaran lokasi ditolak."
          : "Lokasi tidak tersedia. Cuba lagi.";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
</script>
</body>
</html>
